<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Practice setup — native review</title>
<style>body{margin:0;background:#080d11;color:#e7dfc9;font:18px Georgia,serif}header{padding:24px 3vw 14px}h1{font-size:30px;margin:0 0 12px}p{max-width:1100px;line-height:1.5}nav{display:flex;gap:10px;flex-wrap:wrap}button,a{color:inherit}button{font:inherit;padding:10px 18px;border:1px solid #997437;background:#111c21;cursor:pointer}button[aria-pressed=true]{background:#bca068;color:#12100a}.compare{margin-top:16px;display:flex;gap:10px;align-items:center}main{padding:10px 3vw 30px}img{display:block;width:100%;height:auto;border:1px solid #987435}small{color:#bdb4a2}a{text-underline-offset:4px}</style>
<header><h1>Practice setup — playable review</h1><p>A’s paired decks, B’s browser and C’s inline feedback. Native Godot captures with live Caudex/WeatheredQuill text and original card art. Choose a view, then switch between the build and its approved reference.</p>
<nav id="views"></nav><div class="compare"><button id="native" aria-pressed="true">In game</button><button id="concept" aria-pressed="false">Approved concept</button><small id="caption"></small></div></header><main><img id="shot" alt="Practice setup screenshot"></main>
<script>const states=[['Setup','setup','A'],['Deck browser','browser','B'],['Incomplete draft','draft','C'],['Full card','inspection',null],['1280 × 720','small',null],['Match started','in-game',null]];let current=states[0],reference=false;const root='../../../src/L5R.Client/Art/Practice/';function draw(){document.querySelector('#shot').src=reference&&current[2]?root+'approved-'+current[2]+'.png':current[1]+'.png';document.querySelector('#shot').alt=current[0]+(reference?' approved concept':' native Godot capture');document.querySelector('#concept').disabled=!current[2];document.querySelector('#native').setAttribute('aria-pressed',!reference);document.querySelector('#concept').setAttribute('aria-pressed',reference);document.querySelector('#caption').textContent=reference?'Reference artwork':'Actual running client · click image to open full size';document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',states[i]===current));}states.forEach(s=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>{current=s;reference=false;draw()};document.querySelector('#views').append(b)});document.querySelector('#native').onclick=()=>{reference=false;draw()};document.querySelector('#concept').onclick=()=>{reference=true;draw()};document.querySelector('#shot').onclick=()=>window.open(document.querySelector('#shot').src);draw();</script>
</html>
