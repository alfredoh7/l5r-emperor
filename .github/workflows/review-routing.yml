name: Route lane reviews

# Trusted metadata-only routing: checkout is pinned to base.sha, never PR head.
# tools/security/check_policy.py guards this exception; see docs/SUPPLY_CHAIN.md.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: lane-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    name: Route advisory lane reviewers
    permissions:
      contents: read
      issues: write # Apply collaboration lane labels to the PR.
      pull-requests: write # Request lane reviewers using trusted base policy.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never change this to the PR head: this job has a write token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Route using trusted base policy and metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/collab.py route-pr --number "$PR_NUMBER"
