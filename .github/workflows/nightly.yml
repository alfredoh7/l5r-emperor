name: Nightly validation

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Seeded soak, replay and published commands
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/docs/
            !/src/L5R.Client/
            !/content/oracle/
            !/content/legacy/
            !/content/web-research/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned rules SDK only
        run: python tools/bootstrap.py --install --dotnet-only
      - name: Check nightly issue reporting regressions
        run: python -m unittest discover -s tools/nightly -p 'test_*.py' -v
      - name: Build nightly runner
        run: |
          $env:DOTNET_ROOT = "$pwd/.tools/dotnet"
          $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
          $env:DOTNET_CLI_HOME = "$pwd/.cache/dotnet"
          dotnet build tests/L5R.Nightly.Tests/L5R.Nightly.Tests.csproj --disable-build-servers -p:UseSharedCompilation=false -m:1 --nologo
      - name: Run extended checks
        run: |
          $env:DOTNET_ROOT = "$pwd/.tools/dotnet"
          $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
          $env:DOTNET_CLI_HOME = "$pwd/.cache/dotnet"
          New-Item -ItemType Directory -Force artifacts/nightly | Out-Null
          & dotnet tests/L5R.Nightly.Tests/bin/Debug/net10.0/L5R.Nightly.Tests.dll --output artifacts/nightly *> artifacts/nightly/run.log
          $nightlyExit = $LASTEXITCODE
          Get-Content artifacts/nightly/run.log -Tail 20
          exit $nightlyExit
      - name: Preserve summary, coverage and reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence
          path: artifacts/nightly/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report failed main nightly
    needs: validation
    if: always() && needs.validation.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # Create/update the marker-owned nightly failure issue.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools/nightly
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: nightly-evidence
          path: artifacts/nightly
      - name: Open or update nightly-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_REPOSITORY: ${{ github.repository }}
          NIGHTLY_COMMIT: ${{ github.sha }}
          NIGHTLY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/nightly/report_failure.py --repository "$NIGHTLY_REPOSITORY" --commit "$NIGHTLY_COMMIT" --run-url "$NIGHTLY_RUN_URL" --summary artifacts/nightly/summary.json
      - name: Tell the maintainers, if a webhook is configured
        env:
          WEBHOOK: ${{ secrets.CI_FAILURE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No CI_FAILURE_WEBHOOK secret is set; nothing to post."; exit 0; fi
          MESSAGE="The nightly production check failed on main (nightly-broken issue opened or updated). $RUN_URL"
          BODY=$(MESSAGE="$MESSAGE" python3 -c 'import json, os; m = os.environ["MESSAGE"]; print(json.dumps({"content": m, "text": m}))')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK"
