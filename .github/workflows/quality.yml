name: Changed-file quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Changed C# formatting
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR merge commit's two parents supply exact base/head without fetching history.
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/content/
            !/docs/
            !/src/
            !/tests/
            /src/**/*.cs
            /tests/**/*.cs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK only
        run: python tools/bootstrap.py --install --dotnet-only
      - name: Prove changed-file and nullable guards
        env:
          L5R_QUALITY_INTEGRATION: '1'
        run: |
          $env:DOTNET_ROOT = "$pwd/.tools/dotnet"
          $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
          $env:DOTNET_CLI_HOME = "$pwd/.cache/dotnet"
          python -m unittest discover -s tools/quality -p 'test_*.py' -v
      - name: Verify changed C# without rewriting files
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Compare the checked-out merge result to current base. A stale head
          # must not turn unrelated base changes into formatting obligations.
          QUALITY_HEAD: ${{ github.sha }}
        run: |
          $env:DOTNET_ROOT = "$pwd/.tools/dotnet"
          $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
          $env:DOTNET_CLI_HOME = "$pwd/.cache/dotnet"
          if (!$env:QUALITY_BASE) { $env:QUALITY_BASE = 'HEAD^' }
          python tools/quality/check_format.py --base "$env:QUALITY_BASE" --head "$env:QUALITY_HEAD"
