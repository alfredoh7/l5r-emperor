name: Collaboration checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  handoff:
    name: Context and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial workflow tests
        run: python -m unittest discover -s tools/collaboration -p 'test_*.py' -v
      - name: Check actual PR handoff and base
        if: github.event_name == 'pull_request'
        env:
          TASK_BRANCH: ${{ github.head_ref }}
          TASK_BASE: ${{ github.event.pull_request.base.sha }}
          TASK_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TASK_HEAD: ${{ github.event.pull_request.head.sha }}
          # Read-only: lets the stale-base check ask whether the PR's base branch was
          # already the head of a merged PR (the squash-merge case `git` alone can't see).
          GH_TOKEN: ${{ github.token }}
        run: python tools/collab.py audit --base "$TASK_BASE" --head "$TASK_HEAD" --branch "$TASK_BRANCH" --base-ref "$TASK_BASE_REF"
