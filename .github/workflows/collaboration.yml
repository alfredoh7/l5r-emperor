name: Collaboration checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # Audit needs PR base/merge metadata.

concurrency:
  group: collaboration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handoff:
    name: Context and handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Adversarial workflow tests
        run: python -m unittest discover -s tools/collaboration -p 'test_*.py' -v
      - name: Check actual PR handoff and base
        if: github.event_name == 'pull_request'
        env:
          TASK_BRANCH: ${{ github.head_ref }}
          TASK_BASE: ${{ github.event.pull_request.base.sha }}
          TASK_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TASK_HEAD: ${{ github.event.pull_request.head.sha }}
          # Read-only: lets the stale-base check ask whether the PR's base branch was
          # already the head of a merged PR (the squash-merge case `git` alone can't see).
          GH_TOKEN: ${{ github.token }}
        run: python tools/collab.py audit --base "$TASK_BASE" --head "$TASK_HEAD" --branch "$TASK_BRANCH" --base-ref "$TASK_BASE_REF"
      - name: Client-contract ledger (advisory candidates)
        if: github.event_name == 'pull_request'
        env:
          TASK_BASE: ${{ github.event.pull_request.base.sha }}
          TASK_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tools/collab.py ledger --base "$TASK_BASE" --head "$TASK_HEAD" --format markdown >> "$GITHUB_STEP_SUMMARY"
