name: Supply-chain policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Workflow security and ownership policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/security
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned workflow auditor
        run: python -m pip install -r tools/security/requirements.txt
      - name: Validate policy and regression guards
        run: |
          python tools/security/check_policy.py
          python -m unittest discover -s tools/security -p 'test_*.py' -v
      - name: Audit all workflows without a token or paid code scanning
        run: zizmor --offline --persona pedantic --format github .github/workflows
