name: Desktop foundation checks

# Issue #983: pull requests run the Mac job only (free, runs every check). The Windows jobs are check-windows.yml: main, on demand, or a PR labeled windows-ci.

on:
  push:
    branches: [main]
    # Issue #905: a change that touches only documentation (docs/, which includes the per-task handoffs, and the top-level notes) reads no test, so it does not occupy the Mac runner
    # for ~20 minutes. A change that also touches code, a workflow, a skill or AGENTS.md/CLAUDE.md still runs everything.
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'PRODUCT.md', 'DESIGN.md', 'AI_HANDOFF.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'PRODUCT.md', 'DESIGN.md', 'AI_HANDOFF.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    # Only this private repository’s branches may execute on the personal Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # The Windows work runs as parallel jobs (issue #798; the single rules job took ~23 min and set the PR time): tools tests and the
        # small .NET projects ("quick"), the two scratch-repo registration builds, Core in two shards, AI in two shards, and the native
        # Godot client build, import and smoke run (windows-2022-client; its Godot import of ~1500 scans restores the previous import
        # cache). Every Windows job pays its own checkout and tool bootstrap, so do not split further without measuring. Shards come
        # from the test runner's --shard I/N and are exact partitions of one build's cases.
        # The rules jobs skip what only the Godot client reads (1 GB of client art, assets/ui, the .import/.uid sidecars): about a quarter
        # fewer files and ~1.3 GB less to fetch, verified by running every part in such a checkout (issue #798). The client job needs all of it.
        # The Mac runner keeps one job with every check, and macOS coverage is deliberate. It takes one job at a time, so that job
        # runs its stages side by side inside tools/check.sh instead of as more matrix jobs (issue #805). Its checkout cleans the
        # workspace (git clean -ffdx), so every run still bootstraps the tools, builds and does the whole Godot import.
        include:
          - os: macos-local
            runner: [self-hosted, macOS, ARM64, l5r-mac-studio]
            args: ''
            timeout: 25
            sparse: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Issue #905: a hung or crashed test run says where. The runner prints a RUN line before each case (the last one in a timed-out log is the case that hung), and a crash
      # of the .NET process writes a dump that the last step keeps.
      L5R_TEST_TRACE: '1'
      DOTNET_DbgEnableMiniDump: '1'
      DOTNET_DbgMiniDumpType: '2'
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/artifacts/dumps/crash-%p.dmp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Windows runners start from an empty disk: skip ~2.2 GB of screenshots, videos and table source art that no check reads.
          sparse-checkout: ${{ matrix.sparse }}
          sparse-checkout-cone-mode: false
      - name: Fetch main's tip for the diff-scoped comment-swallow lint
        # A single branch tip, not fetch-depth 0: this checkout is intentionally
        # shallow/sparse for slow, fresh-disk Windows runners, and full history
        # for all branches would undo that. tools/lint_comment_swallow.py only
        # needs origin/main to exist locally to compute its diff. The checkout
        # above uses persist-credentials: false (this is a private repo), so
        # this one fetch authenticates itself with the ephemeral job token
        # instead of turning credential persistence back on repo-wide.
        env:
          GH_TOKEN: ${{ github.token }}
        run: git fetch --no-tags --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Prepare local Python environment
        if: runner.os == 'macOS'
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ required'"
          python3 -m venv "$RUNNER_TEMP/l5r-python"
          echo "$RUNNER_TEMP/l5r-python/bin" >> "$GITHUB_PATH"
      - name: Install content image validation dependency
        run: python -m pip install -r tools/content/requirements.txt
      - name: Install pinned project tools
        run: python tools/bootstrap.py --install
      # Godot only reimports what changed when it finds the previous import: restore the newest cache for this Godot pin, save a new one after a passing run.
      - name: Restore Godot import cache
        if: matrix.args == '--client-only'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/L5R.Client/.godot
          key: godot-import-${{ runner.os }}-${{ hashFiles('tools/bootstrap.py', 'src/L5R.Client/project.godot') }}-${{ github.sha }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ hashFiles('tools/bootstrap.py', 'src/L5R.Client/project.godot') }}-
      - name: ${{ matrix.args == '--client-only' && 'Native client build, Godot import and smoke run' || (matrix.args == '' && 'Every check, including the native client (Mac)' || format('Checks {0}', matrix.args)) }}
        env:
          CHECK_ARGS: ${{ matrix.args }}
        run: bash tools/check.sh $CHECK_ARGS  # unquoted on purpose: a matrix value like '--part core --shard 1/2' is several arguments
      - name: Keep the Godot logs of a failed run
        if: failure() && (matrix.args == '' || matrix.args == '--client-only')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-logs-${{ matrix.os }}
          path: artifacts/checks/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep crash dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.os }}
          path: artifacts/dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 3

  # Issue #905: a broken main is told to the maintainers' chat as well as to whoever watches the checks. Posts only when a CI_FAILURE_WEBHOOK secret (a Discord or Slack
  # incoming webhook) exists; without one it does nothing.
  notify-main-failure:
    name: Tell the maintainers main is red
    needs: verify
    if: always() && needs.verify.result == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to the webhook, if one is configured
        env:
          WEBHOOK: ${{ secrets.CI_FAILURE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No CI_FAILURE_WEBHOOK secret is set; nothing to post."; exit 0; fi
          MESSAGE="Main is red: desktop checks failed at ${COMMIT:0:8} (pushed by $ACTOR). $RUN_URL"
          BODY=$(MESSAGE="$MESSAGE" python3 -c 'import json, os; m = os.environ["MESSAGE"]; print(json.dumps({"content": m, "text": m}))')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK"
