name: Desktop foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    # Only this private repository’s branches may execute on the personal Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-local
            runner: [self-hosted, macOS, ARM64, l5r-mac-studio]
          - os: windows-2022
            runner: [windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Prepare local Python environment
        if: runner.os == 'macOS'
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ required'"
          python3 -m venv "$RUNNER_TEMP/l5r-python"
          echo "$RUNNER_TEMP/l5r-python/bin" >> "$GITHUB_PATH"
      - name: Install content image validation dependency
        run: python -m pip install -r tools/content/requirements.txt
      - name: Install pinned project tools
        run: python tools/bootstrap.py --install
      - name: Rules, AI, server, client transport, content and native client
        run: bash tools/check.sh
