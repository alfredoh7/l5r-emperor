name: Desktop foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install content image validation dependency
        run: python -m pip install -r tools/content/requirements.txt
      - name: Install pinned project tools
        run: python tools/bootstrap.py --install
      - name: Rules, AI, server, client transport, content and native client
        run: bash tools/check.sh
